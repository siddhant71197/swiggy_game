<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!--
    THE FAVICON, AND THE ONLY HAND-AUTHORED CUT OF THE MARK IN THIS BRAND.

    Everything else on screen blits the authentic lockup PNG. A favicon cannot:
    <link rel="icon"> takes a whole file, so it cannot address a sub-rectangle
    of the lockup the way AssetRef.rect does everywhere else.

    So this is deliberately the DECLARED FALLBACK SHAPE ('pin-squircle') drawn
    as a file, not an attempt to reproduce the emblem: a solid teardrop pin on
    the brand squircle, with the S-cut omitted. At the 16px this renders at, the
    S-cut is under one pixel wide — drawing it would be inventing detail nobody
    can see, and inventing detail is how a subtly-wrong trademark ships.

    The pin is SOLID and un-outlined, which is the one guideline that survives
    at every size.
  -->
  <rect width="100" height="100" rx="22.5" ry="22.5" fill="#FF5200"/>
  <path d="M50 84 L29.6 58.1 A26 26 0 1 1 70.4 58.1 Z" fill="#FFFFFF"/>
</svg>
